<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div id="calculator">
        <input type="text" id="screen">
        <div class="row">
            <button style="color: orange;" onclick="clearAll()">AC</button>
            <button style="color: orange;" onclick="singleClear()">C</button>
            <button onclick="addvalue('/')">/</button>
        </div>
        <div>
            <button onclick="addvalue(7)">7</button>
            <button onclick="addvalue(8)">8</button>
            <button onclick="addvalue(9)">9</button>
            <button onclick="addvalue('*')">x</button>
        </div>
        <div class="row">
            <button onclick="addValue(4)">4</button>
            <button onclick="addvalue(5)">5</button>
            <button onclick="addvalue(6)">6</button>
            <button onclick="addvalue('-')">-</button>
        </div>
        <div class="row">
            <button onclick="addvalue(1)">1</button>
            <button onclick="addvalue(2)">2</button>
            <button onclick="addvalue(3)">3</button>
            <button onclick="addvalue('+')">+</button>
        </div>
        <div class="row">
            <button onclick="addvalue('00')">00</button>
            <button onclick="addvalue('.')">.</button>
            <button onclick="addvalue(0)">0</button>
            <button onclick="result()" style="background-color: rgb(34, 110, 34);">=</button>
        </div>
    </div>
    <script src=" ./script.js"></script>
</body>

</html>
